# TEMPLATE ONLY. Inspect existing vhosts, DNS and certificates before enabling.
# Replace BOTH certificate placeholders with verified paths on calco-feplanb.
<VirtualHost *:80>
    ServerName inventariospdv-v2.calcoweb.net
    RewriteEngine On
    RewriteRule ^ https://inventariospdv-v2.calcoweb.net%{REQUEST_URI} [R=308,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName inventariospdv-v2.calcoweb.net
    SSLEngine on
    SSLCertificateFile "__VERIFIED_SSLCertificateFile__"
    SSLCertificateKeyFile "__VERIFIED_SSLCertificateKeyFile__"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    # Discard client-supplied forwarding information; Apache supplies one hop.
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Port
    RequestHeader unset Forwarded
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8000/ connectiontimeout=5 timeout=380
    ProxyPassReverse / http://127.0.0.1:8000/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    # %U is the URL path; do not log query strings, request bodies or cookies.
    LogFormat "%a %t %m %U %>s %D" inventarios_safe
    CustomLog ${APACHE_LOG_DIR}/inventarios-uno-a-uno-access.log inventarios_safe
    ErrorLog ${APACHE_LOG_DIR}/inventarios-uno-a-uno-error.log
</VirtualHost>
