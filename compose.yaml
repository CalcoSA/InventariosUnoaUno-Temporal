name: inventarios-uno-a-uno
services:
  app:
    image: ${INVENTARIOS_IMAGE:?Defina INVENTARIOS_IMAGE con la imagen cargada por CI}
    pull_policy: never
    # Requires Linux. Apache on the VM terminates HTTPS.
    network_mode: host
    user: "10001:10001"
    init: true
    restart: unless-stopped
    stop_grace_period: 330s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    env_file:
      - path: /etc/inventarios-uno-a-uno/inventarios.env
        required: true
        format: raw
    environment:
      APP_ENV: production
      AUTH_ENABLED: "true"
      SESSION_COOKIE_SECURE: "true"
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      GOOGLE_CREDENTIALS_PATH: /etc/inventarios-uno-a-uno/credentials.json
      GOOGLE_TOKEN_PATH: /var/lib/inventarios-uno-a-uno/token.json
      SSO_PUBLIC_KEY_PATH: /etc/inventarios-uno-a-uno/sso_public.pem
      INVENTORY_LOCK_PATH: /var/lock/inventarios-uno-a-uno/inventory.lock
    volumes:
      - type: bind
        source: /etc/inventarios-uno-a-uno/credentials.json
        target: /etc/inventarios-uno-a-uno/credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/inventarios-uno-a-uno/sso_public.pem
        target: /etc/inventarios-uno-a-uno/sso_public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/inventarios-uno-a-uno
        target: /var/lib/inventarios-uno-a-uno
        bind:
          create_host_path: false
      - inventory-locks:/var/lock/inventarios-uno-a-uno
    healthcheck:
      test: [CMD, python, -B, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)) == {'status':'ok'}"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  inventory-locks:
