name: CI-CD Inventarios GCP

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      APP_ENV: testing
      AUTH_ENABLED: 'false'
      FLASK_DEBUG: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Preparar Node para pruebas de navegador simuladas
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Preparar PHP y dependencias Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y php-cli
          php -r 'exit(extension_loaded("openssl") ? 0 : 1);'
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validar sintaxis y carga Gunicorn sin abrir puertos
        run: |
          bash -n scripts/docker_release.sh
          INVENTARIOS_IMAGE=inventarios-uno-a-uno:validation docker compose config --quiet --no-env-resolution
          node --check app/static/js/auth.js
          node --check app/static/js/inventory.js
          php -l wordpress/inventarios-sso.php
          gunicorn --check-config --bind 127.0.0.1:8000 --workers 1 --threads 4 wsgi:app
      - name: Suite completa sin Google ni pruebas omitidas
        run: |
          mkdir -p .runtime
          python -B -m pytest -q -p no:cacheprovider --junitxml=.runtime/ci-tests.xml
          python - <<'PY'
          from xml.etree import ElementTree
          suites = ElementTree.parse('.runtime/ci-tests.xml').getroot().iter('testsuite')
          assert sum(int(s.get('skipped', '0')) for s in suites) == 0, 'CI no permite pruebas omitidas'
          PY
      - name: Validar Dockerfile e imagen en cada push y PR
        if: matrix.python == '3.12'
        run: |
          docker build --pull --platform linux/amd64 --tag inventarios-uno-a-uno:test .
          docker run --rm --network none --read-only --tmpfs /tmp \
            --entrypoint python inventarios-uno-a-uno:test -m pip check
          docker run --rm --network none --read-only --tmpfs /tmp \
            -e APP_ENV=testing -e AUTH_ENABLED=false -e SESSION_COOKIE_SECURE=false \
            --entrypoint python inventarios-uno-a-uno:test -B -c \
            'from app import create_app; assert create_app().test_client().get("/healthz").json == {"status":"ok"}'

  deploy:
    name: Construir y desplegar Docker en GCP
    needs: tests
    # Repository variables: this job stays disabled until the VM is prepared.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_type == 'branch' &&
      github.ref_name == (vars.GCP_DEPLOY_BRANCH || github.event.repository.default_branch) &&
      vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ${{ vars.GCP_DEPLOY_RUNNER || 'ubuntu-24.04' }}
    environment: production
    timeout-minutes: 45
    concurrency:
      group: inventarios-gcp-production
      cancel-in-progress: false
    steps:
      - name: Obtener el commit probado
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Construir imagen de produccion y comprobarla sin abrir puertos
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          docker build --pull --platform linux/amd64 --build-arg VCS_REF="$DEPLOY_SHA" \
            --tag "inventarios-uno-a-uno:ci-$DEPLOY_SHA" .
          docker run --rm --network none --read-only --tmpfs /tmp \
            --entrypoint python "inventarios-uno-a-uno:ci-$DEPLOY_SHA" -m pip check
          docker run --rm --network none --read-only --tmpfs /tmp \
            -e APP_ENV=testing -e AUTH_ENABLED=false -e SESSION_COOKIE_SECURE=false \
            --entrypoint python "inventarios-uno-a-uno:ci-$DEPLOY_SHA" -B -c \
            'from app import create_app; assert create_app().test_client().get("/healthz").json == {"status":"ok"}'
      - name: Enviar imagen y ejecutar despliegue restringido por SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_SSH_USER }}
          VM_PORT: ${{ secrets.GCP_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GCP_SSH_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VM_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'GCP_VM_HOST debe ser DNS o IPv4'; exit 1; }
          [[ "$VM_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'GCP_SSH_USER inválido'; exit 1; }
          VM_PORT="${VM_PORT:-22}"
          [[ "$VM_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$VM_PORT >= 1 && 10#$VM_PORT <= 65535 )) || { echo 'Puerto inválido'; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Faltan secretos SSH'; exit 1; }
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/inventarios-ssh.XXXXXX")
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          image_id=$(docker image inspect --format '{{.Id}}' "inventarios-uno-a-uno:ci-$DEPLOY_SHA")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          docker image save "inventarios-uno-a-uno:ci-$DEPLOY_SHA" | gzip -1 | \
          ssh -F /dev/null -i "$ssh_dir/key" -p "$VM_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$VM_USER@$VM_HOST" \
            "sudo -n /usr/local/sbin/inventarios-docker-release $DEPLOY_SHA $image_id"
      - name: Comprobar Apache y HTTPS externos
        env:
          HEALTH_URL: ${{ vars.GCP_HEALTHCHECK_URL || 'https://inventariospdv-v2.calcoweb.net/healthz' }}
        run: |
          [[ "$HEALTH_URL" == https://* ]] || { echo 'El healthcheck debe utilizar HTTPS'; exit 1; }
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused "$HEALTH_URL" | \
            python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok"}'
